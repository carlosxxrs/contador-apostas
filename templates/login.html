<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .card { background: #1e1e1e; max-width: 350px; margin: 0 auto; padding: 20px; border-radius: 8px; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 4px; }
        button { width: 95%; padding: 10px; background: #00e676; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; color: #121212; margin-top: 10px; }
        a { color: #00e676; text-decoration: none; }
        .flash { background: #ff5252; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
        <p>Não tem conta? <a href="/register">Cadastre-se</a></p>
    </div>
</body>
</html>
